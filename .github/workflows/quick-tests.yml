# Fork-only helper: run a chosen set of tests on a chosen branch.
# Lives on the fork's main only; never part of a pull request upstream.
name: Quick tests

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to test
        required: true
        default: stl-recognise-shapes
      tests:
        description: pytest arguments
        required: true
        default: tests/test_mesh_recognise.py

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for Qt/OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-shape0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-cursor0 \
            libfontconfig1 libdbus-1-3
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --extra dev --locked --python 3.12
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTEST_ARGS: ${{ inputs.tests }}
        run: uv run pytest $PYTEST_ARGS -q -n 4 -p no:cacheprovider
